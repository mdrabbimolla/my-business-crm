name: Test Central CRM API

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-cloud-api:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt

      - name: Compile CRM Python files
        run: |
          python -m py_compile app.py cloud_client.py cloud_api.py central_api_core.py

      - name: Run central API tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
