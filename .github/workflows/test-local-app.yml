name: Local App Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout CRM
        uses: actions/checkout@v4
      - name: Install test dependencies
        run: python -m pip install --upgrade pip flask
      - name: Run local Flask smoke tests
        run: python -m unittest discover -s tests -p 'test_local_app_smoke.py' -v
