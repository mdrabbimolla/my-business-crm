name: Build My Business CRM APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout CRM
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          swap-size-mb: 1024
          remove-dotnet: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Checkout python-for-android
        uses: actions/checkout@v4
        with:
          repository: kivy/python-for-android
          ref: 2026.05.09
          path: python-for-android

      - name: Build p4a Docker image
        working-directory: python-for-android
        run: |
          docker build --tag mycrm-p4a .

      - name: Prepare CRM
        run: |
          cp app.py main.py

      - name: Build APK with Docker
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/home/user/app" \
            --workdir /home/user/app \
            mycrm-p4a \
            bash -lc '
              . /venv/bin/activate
              p4a apk \
                --private /home/user/app \
                --package com.mycrm.app \
                --name "My Business CRM" \
                --version 1.0 \
                --bootstrap webview \
                --requirements flask \
                --arch arm64-v8a \
                --port 5000 \
                --debug
            '

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-business-crm-apk
          path: "**/*.apk"
          if-no-files-found: error
