name: Build My Business CRM APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout CRM
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ant autoconf automake autopoint ccache cmake g++ gcc git lbzip2 libffi-dev libltdl-dev libssl-dev libtool make patch pkg-config unzip wget zip

      - name: Install p4a
        run: |
          python -m pip install --upgrade pip
          pip install "Cython<3"
          pip install python-for-android==2026.05.09

      - name: Prepare app
        run: |
          cp app.py main.py

      - name: Build APK
        run: |
          p4a apk \
            --private . \
            --package com.mycrm.app \
            --name "My Business CRM" \
            --version 1.0 \
            --bootstrap webview \
            --requirements flask \
            --arch arm64-v8a \
            --android-api 33 \
            --ndk-api 24 \
            --sdk-dir "$ANDROID_HOME" \
            --ndk-dir "$ANDROID_HOME/ndk/28.2.13676358" \
            --port 5000 \
            --dist-name mycrm

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-business-crm-apk
          path: "**/*.apk"
