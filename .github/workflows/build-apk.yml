name: Build My Business CRM APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CRM
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" \
                     "platforms;android-33" \
                     "build-tools;35.0.0" \
                     "ndk;28.2.13676358"

            - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            unzip \
            wget \
            zip

      - name: Install Python for Android
        run: |
          python -m pip install --upgrade pip
          pip install python-for-android==2026.05.09

      - name: Prepare Flask entry point
        run: |
          cp app.py main.py

      - name: Build APK
        run: |
          p4a apk \
            --private . \
            --package com.mycrm.app \
            --name "My Business CRM" \
            --version 1.0 \
            --bootstrap webview \
            --requirements flask \
            --arch arm64-v8a \
            --android-api 33 \
            --ndk-api 24 \
            --sdk-dir "$ANDROID_HOME" \
            --ndk-dir "$ANDROID_HOME/ndk/28.2.13676358" \
            --port 5000 \
            --dist-name mycrm

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-business-crm-apk
          path: "**/*.apk"
