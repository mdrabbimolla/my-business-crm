name: Build My Business CRM APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout CRM
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache
          sudo apt-get clean
          sudo docker system prune -af --volumes || true
          echo "Disk after cleanup:"
          df -h

      - name: Verify Android SDK
        run: |
          test -d /usr/local/lib/android/sdk
          test -x /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --version
          echo "Android SDK is available"

      - name: Pull official python-for-android image
        run: |
          docker pull kivy/python-for-android:latest
          docker image ls

      - name: Prepare CRM
        run: |
          test -f app.py
          cp app.py main.py
          test -s main.py
          echo "main.py created successfully"

      - name: Build APK
        run: |
          docker run --rm             --volume "$GITHUB_WORKSPACE:/home/user/crm:ro"             --volume "/usr/local/lib/android/sdk:/opt/android-sdk:ro"             --workdir /home/user             --env ANDROIDSDK=/opt/android-sdk             --env ANDROID_HOME=/opt/android-sdk             --env ANDROID_SDK_ROOT=/opt/android-sdk             --env ANDROIDNDK=/home/user/.android/android-ndk             --env ANDROID_NDK_HOME=/home/user/.android/android-ndk             --env PATH=/opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools:/opt/android-sdk/tools/bin:$PATH             kivy/python-for-android:latest             sh -c '
              rm -rf /tmp/mycrm &&
              mkdir -p /tmp/mycrm &&
              cp -a /home/user/crm/. /tmp/mycrm/ &&
              chmod -R u+rwX /tmp/mycrm &&
              cd /tmp/mycrm &&
              /home/user/app/venv/bin/p4a apk                 --private /tmp/mycrm                 --sdk-dir /opt/android-sdk                 --ndk-dir /home/user/.android/android-ndk                 --package com.mycrm.app                 --name "My Business CRM"                 --version 1.0                 --bootstrap webview                 --requirements flask                 --port 5000                 --arch arm64-v8a                 --android-api 35                 --ndk-api 24
            '

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-business-crm-apk
          path: "**/*.apk"
          if-no-files-found: error
