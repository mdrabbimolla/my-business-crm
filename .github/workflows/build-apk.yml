name: Build My Business CRM APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout CRM
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          swap-size-mb: 2048
          remove-dotnet: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Free additional disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache
          sudo apt-get clean
          sudo docker system prune -af --volumes || true
          df -h

      - name: Pull official python-for-android image
        run: |
          docker pull kivy/python-for-android:latest
          docker image ls

      - name: Prepare CRM
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          pwd
          echo "Workspace contents:"
          ls -la
          test -f app.py
          cp app.py main.py
          test -s main.py
          echo "main.py created successfully"

      - name: Build APK
        run: |
          docker run --rm             --volume "$GITHUB_WORKSPACE:/home/user/crm"             --workdir /home/user/crm             kivy/python-for-android:latest             /home/user/app/venv/bin/p4a apk               --private /home/user/crm               --package com.mycrm.app               --name "My Business CRM"               --version 1.0               --bootstrap webview               --requirements flask               --port 5000               --arch arm64-v8a

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-business-crm-apk
          path: "**/*.apk"
          if-no-files-found: error
