<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lead Notes</title>
<style>
body{margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#172554}
.header{background:#173b70;color:white;padding:20px;border-bottom:4px solid #d4af37}
.container{max-width:700px;margin:auto;padding:15px}
.card{background:white;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.date{font-weight:bold;color:#173b70;margin-bottom:7px}
.note{line-height:1.55;color:#334155;white-space:pre-wrap}
.back{display:block;text-align:center;background:#173b70;color:white;text-decoration:none;padding:12px;border-radius:9px;font-weight:bold;margin-top:15px}
</style>
</head>
<body>
{% include "menu.html" %}
<div class="header"><h2>📝 Lead Note History</h2></div>
<div class="container">
<div class="card"><strong>👤 {{ lead['name'] or 'Name not added' }}</strong><br>📞 {{ lead['phone'] }}</div>
{% if notes %}
{% for item in notes %}
<div class="card"><div class="date">📅 {{ item['note_date'] }}</div><div class="note">{{ item['note'] }}</div></div>
{% endfor %}
{% else %}
<div class="card" style="text-align:center;color:#64748b">📭 No note history yet.</div>
{% endif %}
<a class="back" href="/leads">← Back to Leads</a>
</div>
</body>
</html>
