<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Lead - My Business CRM</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .header {
            background: linear-gradient(135deg, #172554, #173b70);
            color: white;
            padding: 18px;
            border-bottom: 3px solid #d4af37;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 18px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            color: #374151;
            font-weight: 700;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #173b70;
            color: white;
            font-size: 16px;
            font-weight: 700;
        }

        .back {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #173b70;
            text-decoration: none;
            font-weight: 700;
        }

        .hint {
            margin-top: 6px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>

<body>

{% include "menu.html" %}

<div class="header">
    <h1>📞 Add New Lead</h1>
</div>

<div class="container">

    <div class="card">

        <form method="POST">

            <label>Customer Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter customer name"
            >

            <label>Phone Number *</label>

            <input
                type="tel"
                name="phone"
                placeholder="Enter phone number"
                required
            >

            <div class="hint">
                ⚠️ একই phone number দ্বিতীয়বার entry করা যাবে না।
            </div>

            <label>Project</label>

            <select name="project_id">

                <option value="">
                    📂 Unassigned
                </option>

                {% for project in projects %}

                <option value="{{ project['id'] }}">
                    🏗️ {{ project['name'] }}
                </option>

                {% endfor %}

            </select>


            <label>👤 Assigned Salesperson</label>

            <select name="assigned_to">

                <option value="">
                    👤 Unassigned
                </option>

                {% for user in sales_users %}

                <option value="{{ user['username'] }}">
                    👤 {{ user['name'] or user['username'] }}
                </option>

                {% endfor %}

            </select>


            <label>Follow-up Date</label>

            <input
                type="date"
                name="follow_up_date"
            >
<label>📍 Visit Date</label>

<input
    type="date"
    name="visit_date"
>

<label>⏰ Visit Time</label>

<input
    type="time"
    name="visit_time"
>

            <label>Status</label>

            <select name="status">

                <option value="New">
                    New
                </option>

                <option value="Interested">
                    Interested
                </option>

                <option value="Not Interested">
                    Not Interested
                </option>

                <option value="Call Later">
                    Call Later
                </option>

                <option value="Converted">
                    Converted
                </option>

            </select>

            <label>Notes</label>

            <textarea
                name="notes"
                placeholder="Write conversation notes..."
            ></textarea>

            <button type="submit">
                💾 Save Lead
            </button>

        </form>

        <a class="back" href="/dashboard">
            ← Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
